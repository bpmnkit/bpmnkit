[workspace]
resolver = "2"
members = ["crates/*"]
# apps/reebe is its own workspace; it is consumed by path only.
exclude = ["apps"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bpmnkit/bpmnkit"
homepage = "https://bpmnkit.com"
# Highest MSRV among the dependencies as resolved (indexmap 2.14 / hashbrown 0.17: 1.85).
# `clippy::incompatible_msrv` checks our own std usage against it.
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
# Same version as apps/reebe (reebe-bpmn, reebe-dmn), so reebe builds one copy.
quick-xml = "0.36"

# Internal crates: lockstep versions (see doc/rust-crates-release.md). `path` for the workspace,
# `version` for crates.io. bpmnkit-feel is declared inline in each member instead, because
# members differ on `default-features` (a workspace entry cannot be overridden to `false`).
bpmnkit-spec = { path = "crates/bpmnkit-spec", version = "0.2.0" }
bpmnkit-xml = { path = "crates/bpmnkit-xml", version = "0.2.0" }
bpmnkit-bpmn = { path = "crates/bpmnkit-bpmn", version = "0.2.0" }
bpmnkit-dmn = { path = "crates/bpmnkit-dmn", version = "0.2.0" }
bpmnkit-form = { path = "crates/bpmnkit-form", version = "0.2.0" }
bpmnkit-compat = { path = "crates/bpmnkit-compat", version = "0.2.0" }
bpmnkit-lint = { path = "crates/bpmnkit-lint", version = "0.2.0" }
bpmnkit-layout = { path = "crates/bpmnkit-layout", version = "0.2.0" }
bpmnkit-builder = { path = "crates/bpmnkit-builder", version = "0.2.0" }
bpmnkit-text = { path = "crates/bpmnkit-text", version = "0.2.0" }
bpmnkit-diff = { path = "crates/bpmnkit-diff", version = "0.2.0" }
bpmnkit-ascii = { path = "crates/bpmnkit-ascii", version = "0.2.0" }
bpmnkit-render = { path = "crates/bpmnkit-render", version = "0.2.0", default-features = false }

# Fat LTO + one codegen unit: whole-program inlining across the crates. `panic` stays
# `unwind` because bpmnkit-fuzz catches panics in its release build.
[profile.release]
lto = "fat"
codegen-units = 1
