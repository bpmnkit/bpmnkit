# Size flags for the browser build only; native builds keep the release profile.
# lto is left out: `-C lto` as a rustflag conflicts with embed-bitcode, and
# `lto = "fat"` in a profile gains nothing on top of these (measured 2026-11-08).
# strip=symbols drops the ~1.6 MB `name` section (−165 KB gzip), which wasm-opt
# used to remove; reebe-wasm now builds without wasm-opt (see its Cargo.toml).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "opt-level=z", "-C", "codegen-units=1", "-C", "panic=abort", "-C", "strip=symbols"]
