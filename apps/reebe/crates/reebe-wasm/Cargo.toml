[package]
name = "reebe-wasm"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WebAssembly playground for the Reebe BPMN workflow engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
chrono = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["executor"] }
base64 = { workspace = true }
reebe-db = { workspace = true, default-features = false, features = ["memory"] }
reebe-engine = { workspace = true, default-features = false, features = ["memory"] }
# Provide a JS randomness source for uuid v4 generation in the browser
uuid = { workspace = true, features = ["js"] }

[features]
default = []
# Zeebe's deploy-time validation, as on the server. Off: it adds ~106 KB gzip
# (621 → 728 KB), over scripts/check-wasm-size.mjs's 640 KB budget.
zeebe-validate = ["reebe-engine/zeebe-validate"]

# No wasm-opt: after the size rustflags in apps/reebe/.cargo/config.toml, binaryen
# shrinks the raw file but grows the gzip (-O: 621 → 648 KB, binaryen 116), and
# skipping it leaves wasm-pack nothing to download. scripts/check-wasm-size.mjs
# holds the size budget.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
