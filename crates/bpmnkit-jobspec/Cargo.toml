[package]
name = "bpmnkit-jobspec"
description = "Job worker IR for BPMN Kit: extracts job types from BPMN, binds OpenAPI operations, classifies each job as connector, REST or worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["bpmn", "camunda", "zeebe", "codegen", "workflow"]
categories = ["development-tools"]
# Not published before bpmnkit-codegen (P3) needs it on crates.io (doc/plans/c8-workers-and-rust-cli.md §3).
publish = false
# Tests read the shared corpus under ../../conformance and ../../spec, outside the package.
exclude = ["tests/"]

# WASM-safe: no tokio, no I/O (enforced by tests/no_tokio.rs).
[dependencies]
bpmnkit-bpmn = { workspace = true }
bpmnkit-feel = { path = "../bpmnkit-feel", version = "0.6.1", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
proptest = "1"
