[package]
name = "bpmnkit-codegen"
description = "Deterministic job worker code generation for BPMN Kit: target-agnostic emitters, write/check helpers, Java (Maven) target"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["bpmn", "camunda", "zeebe", "codegen", "workflow"]
categories = ["development-tools"]
# Not published before the Rust emitter (P3) lands (doc/plans/c8-workers-and-rust-cli.md §3).
publish = false
# Tests read goldens and the shared corpus outside the package.
exclude = ["tests/"]

# WASM-safe core: no tokio, no network. `write` is the only module touching the filesystem.
[dependencies]
bpmnkit-jobspec = { path = "../bpmnkit-jobspec", version = "0.6.1" }

[dev-dependencies]
bpmnkit-bpmn = { workspace = true }
insta = "1"
tempfile = "3"
