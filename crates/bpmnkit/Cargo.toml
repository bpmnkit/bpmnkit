[package]
name = "bpmnkit"
description = "BPMN Kit for Rust: BPMN, DMN, FEEL and Camunda forms (parse, serialize, evaluate, lint, lay out, build), one dependency with a cargo feature per bpmnkit-* crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bpmn", "dmn", "feel", "camunda", "workflow"]
categories = ["parser-implementations", "encoding"]
# Tests read the shared corpus under ../../conformance, outside the package.
exclude = ["tests/", "package.json"]

[dependencies]
bpmnkit-spec = { workspace = true, optional = true }
bpmnkit-xml = { workspace = true, optional = true }
bpmnkit-bpmn = { workspace = true, optional = true }
bpmnkit-feel = { path = "../bpmnkit-feel", version = "0.2.0", optional = true }
bpmnkit-dmn = { workspace = true, optional = true }
bpmnkit-form = { workspace = true, optional = true }
bpmnkit-compat = { workspace = true, optional = true }
bpmnkit-lint = { workspace = true, optional = true }
bpmnkit-layout = { workspace = true, optional = true }
bpmnkit-builder = { workspace = true, optional = true }
bpmnkit-text = { workspace = true, optional = true }
bpmnkit-render = { workspace = true, optional = true }
bpmnkit-diff = { workspace = true, optional = true }
bpmnkit-ascii = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
# What most users reach for: read, write and evaluate models.
default = ["feel", "bpmn", "dmn", "form"]
# Not `render-png` (a raster stack); add it yourself when you need PNGs.
full = ["spec", "xml", "bpmn", "feel", "dmn", "form", "compat", "lint", "layout", "builder", "text", "render", "diff", "diff-html", "ascii"]
spec = ["dep:bpmnkit-spec"]
xml = ["dep:bpmnkit-xml"]
bpmn = ["dep:bpmnkit-bpmn"]
feel = ["dep:bpmnkit-feel"]
dmn = ["dep:bpmnkit-dmn"]
form = ["dep:bpmnkit-form"]
compat = ["dep:bpmnkit-compat"]
lint = ["dep:bpmnkit-lint"]
layout = ["dep:bpmnkit-layout"]
builder = ["dep:bpmnkit-builder"]
# Process text and compact JSON expand into BPMN/DMN models, so their types must be reachable.
text = ["dep:bpmnkit-text", "bpmn", "dmn"]
# BPMN to SVG; models without diagram interchange are laid out first.
render = ["dep:bpmnkit-render", "bpmnkit-render/auto-layout", "bpmn"]
# SVG → PNG with resvg and the bundled Inter subset: same pixels on every machine.
render-png = ["render", "bpmnkit-render/png"]
# PNG text may also use the machine's fonts (FontSource::System / Both).
render-system-fonts = ["render-png", "bpmnkit-render/system-fonts"]
# Semantic diff, field-level changes and the semantic hash.
diff = ["dep:bpmnkit-diff", "bpmn"]
# The self-contained HTML diff viewer and the diff-over-diagram SVG.
diff-html = ["diff", "render", "bpmnkit-diff/html"]
# BPMN, DMN and forms as Unicode box-drawing text (terminals, chat code blocks).
ascii = ["dep:bpmnkit-ascii"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "text_to_bpmn"
required-features = ["text"]

[[example]]
name = "eval_dmn"
required-features = ["dmn", "feel", "text"]

[[example]]
name = "lint_report"
required-features = ["lint", "bpmn"]

[[example]]
name = "render_svg"
required-features = ["render"]

[[example]]
name = "render_png"
required-features = ["render-png", "diff-html"]

[[example]]
name = "diff_html"
required-features = ["diff-html"]

[[example]]
name = "text_to_png"
required-features = ["render-png", "text"]
