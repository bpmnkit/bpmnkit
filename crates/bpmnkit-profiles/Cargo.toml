[package]
name = "bpmnkit-profiles"
description = "Profile store paths and casen-to-bpmnkit copy migration for the BPMN Kit CLI (Rust twin of @bpmnkit/profiles' config lookup)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["bpmn", "camunda", "profiles", "cli", "config"]
categories = ["command-line-utilities"]
# Not published before P8 (see doc/plans/c8-workers-and-rust-cli.md §3).
publish = false

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
