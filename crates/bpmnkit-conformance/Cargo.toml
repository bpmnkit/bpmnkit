[package]
name = "bpmnkit-conformance"
description = "Shared conformance cases (FEEL, BPMN, DMN) and runner for the BPMN Kit Rust crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
bpmnkit-feel = { path = "../bpmnkit-feel" }
bpmnkit-bpmn = { path = "../bpmnkit-bpmn" }
bpmnkit-dmn = { path = "../bpmnkit-dmn" }
