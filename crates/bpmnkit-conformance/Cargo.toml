[package]
name = "bpmnkit-conformance"
description = "Shared conformance cases (FEEL, BPMN, DMN, forms, lint, optimize, compat, migrate, layout, builder, text, compact, ascii) and runner for the BPMN Kit Rust crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
bpmnkit-feel = { path = "../bpmnkit-feel", version = "0.3.0" }
bpmnkit-bpmn = { workspace = true }
bpmnkit-diff = { workspace = true, features = ["html"] }
bpmnkit-form = { workspace = true }
bpmnkit-dmn = { workspace = true }
bpmnkit-compat = { workspace = true }
bpmnkit-lint = { workspace = true }
bpmnkit-layout = { workspace = true }
bpmnkit-builder = { workspace = true }
bpmnkit-text = { workspace = true }
bpmnkit-render = { workspace = true, features = ["auto-layout", "dmn"] }
bpmnkit-ascii = { workspace = true }
indexmap = { workspace = true }
