[package]
name = "bpmnkit-text"
description = "Text formats for BPMN Kit: BPMN and DMN compact JSON, the process line format and connector lines (Rust twin of @bpmnkit/core's compact.ts and process-text.ts)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bpmn", "dmn", "text", "camunda", "llm"]
categories = ["parser-implementations", "text-processing"]
# Tests and benches read the shared corpus under ../../conformance, outside the package.
exclude = ["tests/", "benches/", "package.json"]

[dependencies]
bpmnkit-bpmn = { workspace = true }
bpmnkit-compat = { workspace = true }
bpmnkit-dmn = { workspace = true }
bpmnkit-feel = { path = "../bpmnkit-feel", version = "0.2.0" }
bpmnkit-layout = { workspace = true }
bpmnkit-xml = { workspace = true }
indexmap = { workspace = true }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "text"
harness = false
