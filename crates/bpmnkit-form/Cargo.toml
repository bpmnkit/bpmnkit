[package]
name = "bpmnkit-form"
description = "Camunda Form model, parser and serializer for BPMN Kit (Rust twin of @bpmnkit/core's form parser and exporter)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bpmnkit-spec = { path = "../bpmnkit-spec" }
indexmap = { workspace = true }
serde = { workspace = true }
# float_roundtrip: JS parses decimals to the nearest double, serde_json's fast path may not.
serde_json = { workspace = true, features = ["float_roundtrip"] }
