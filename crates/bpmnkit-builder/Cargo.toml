[package]
name = "bpmnkit-builder"
description = "Fluent BPMN process/diagram builders and DMN decision-table/DRD builders for BPMN Kit (Rust twin of @bpmnkit/core's Bpmn.createProcess and Dmn builders)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bpmnkit-bpmn = { path = "../bpmnkit-bpmn" }
bpmnkit-dmn = { path = "../bpmnkit-dmn" }
bpmnkit-layout = { path = "../bpmnkit-layout" }
bpmnkit-xml = { path = "../bpmnkit-xml" }
indexmap = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "builder"
harness = false
