[package]
name = "bpmnkit-dmn"
description = "DMN 1.3 model, parser and lossless serializer for BPMN Kit (Rust twin of @bpmnkit/core's DMN I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bpmnkit-xml = { path = "../bpmnkit-xml" }
indexmap = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "io"
harness = false
