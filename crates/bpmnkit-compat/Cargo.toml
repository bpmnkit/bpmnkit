[package]
name = "bpmnkit-compat"
description = "Camunda 8 version compatibility checks and Camunda 7 to 8 migration (with JUEL to FEEL) for BPMN Kit (Rust twin of @bpmnkit/core's camunda-compat and camunda7)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["camunda", "bpmn", "migration", "compatibility", "zeebe"]
categories = ["development-tools", "parser-implementations"]
# Tests and benches read the shared corpus under ../../conformance, outside the package.
exclude = ["tests/", "benches/", "package.json"]

[dependencies]
bpmnkit-bpmn = { workspace = true }
bpmnkit-feel = { path = "../bpmnkit-feel", version = "0.4.0", default-features = false }
bpmnkit-spec = { workspace = true }
bpmnkit-xml = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }

[features]
default = ["full-feel"]
# bpmnkit-feel's IANA zones and full regex. Off (reebe-wasm): fixed offsets only and
# regex's minimal Unicode, like reebe's own FEEL in the browser; ~150 KB gzip less.
full-feel = ["bpmnkit-feel/tz", "bpmnkit-feel/full-regex"]

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
