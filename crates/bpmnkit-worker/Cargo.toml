[package]
name = "bpmnkit-worker"
description = "Camunda 8 job worker runtime over the REST /v2 API: activate/complete/fail/error/update client, OAuth2, a bounded polling loop with backoff, graceful drain, metrics and test doubles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["camunda", "zeebe", "bpmn", "job-worker", "workflow"]
categories = ["api-bindings", "asynchronous", "network-programming"]
# Tests read the vendored spec and fixtures; the spec is test input, not part of the API.
exclude = ["tests/", "spec/", "package.json"]

[dependencies]
# rustls with ring: no OpenSSL or cmake on the build machine. 0.12 supports the 1.85 MSRV.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.40", features = ["rt", "sync", "time", "macros", "signal"] }
tracing = "0.1"
# `grpc` feature. Hand-written prost messages and client (no protoc, no build script); the
# vendored proto in spec/ is checked against them by a test.
# 0.14: 0.12 pulled in the unmaintained rustls-pemfile (RUSTSEC-2025-0134).
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }

[features]
default = ["oauth"]
# OAuth2 client-credentials token source with a shared, refreshed cache.
oauth = []
# `CounterMetrics::render_prometheus` (text exposition format, no extra dependency).
prometheus = []
# `testing::{MockJob, FakeClient, run_handler}` for unit-testing handlers without a cluster.
testing = []
# Job streaming (`StreamActivatedJobs`) next to polling. Off by default, as in camunda-client-java.
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

# Plain loop like the other crates' benches; scripts/bench-rs.mjs parses its stdout.
[[bench]]
name = "stream_latency"
harness = false

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
yaml-rust2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "test-util", "net"] }
# 0.6.5 uses let chains (Rust 1.88) without raising its rust-version; 0.6.4 builds on our 1.85 MSRV.
wiremock = "=0.6.4"
# The grpc tests run a mock Gateway, which needs tonic's server router; the library does not.
tonic = { version = "0.14", default-features = false, features = ["router"] }
