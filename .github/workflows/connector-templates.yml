name: Connector templates

# Refreshes the Camunda out-of-the-box connector templates from the marketplace registry:
# the full set in @bpmnkit/connectors and the slim set in @bpmnkit/core/connectors, both
# written by `scripts/update-connectors.mjs`. An unchanged registry writes nothing and opens
# no pull request.
#
# It opens a pull request rather than publishing: a template that renames an input changes
# what generated diagrams bind, and that is worth a human reading the diff. The tests check
# that the two bundles still agree template by template.

on:
  schedule:
    - cron: "0 4 * * 0" # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch templates
        run: pnpm update-connectors

      - name: Test
        run: pnpm turbo test --filter @bpmnkit/core --filter @bpmnkit/connectors

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/connector-templates-refresh
          commit-message: "chore(connectors): refresh Camunda connector templates"
          title: "chore(connectors): refresh Camunda connector templates"
          body: |
            Weekly refresh of the Camunda out-of-the-box connector templates from
            https://marketplace.cloud.camunda.io/api/v1/ootb-connectors.

            Generated by `.github/workflows/connector-templates.yml`. Core's slim bundle and the
            full bundle were written from the same fetch, and the tests check they agree.

            Read the diff for renamed or removed inputs before merging, and add a changeset for
            `@bpmnkit/core` and `@bpmnkit/connectors` if this should reach npm.
          add-paths: |
            packages/connectors/src/templates
            packages/core/src/connectors/templates
