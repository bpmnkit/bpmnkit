name: Wasm workers

# Separate cargo workspace (wasm/): wasmtime needs a newer rustc than the root workspace's MSRV.
# Path-filtered so the main CI time is unchanged; weekly run for dependency drift.
on:
  pull_request:
    branches: [main]
    paths: &paths
      - "wasm/**"
      - "crates/bpmnkit-worker/**"
      - "crates/bpmnkit-jobspec/**"
      - "crates/bpmnkit-bpmn/**"
      - "apps/reebe/**"
      - ".cargo/audit.toml"
      - ".github/workflows/wasm-workers.yml"
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

concurrency:
  group: wasm-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-workers:
    name: Wasm workers
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      BPMNKIT_WORKER_E2E_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy --target wasm32-wasip2
          rustup default 1.97

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check
        working-directory: wasm

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: wasm

      # The e2e tests need reebe: crates/host/tests/reebe_e2e.rs (a real `echo` job) and
      # crates/builder/tests/blueprint_e2e.rs (order-fulfilment: build, hot-load, happy + declined).
      # The first completes a job of a real `echo`
      # component on a reebe server; reebe is its own workspace, cached separately.
      - uses: Swatinem/rust-cache@v2
        with:
          key: reebe
          workspaces: apps/reebe -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build reebe (embedded SQLite)
        run: cargo build --manifest-path apps/reebe/Cargo.toml --locked --no-default-features --features embedded -p reebe-server

      - name: Start reebe
        run: |
          mkdir -p "$RUNNER_TEMP/reebe-data"
          XDG_DATA_HOME="$RUNNER_TEMP/reebe-data" REEBE_PORT=18080 REEBE_GRPC_PORT=26599 \
            apps/reebe/target/debug/reebe-server > "$RUNNER_TEMP/reebe.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "$BPMNKIT_WORKER_E2E_URL/v2/topology" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/reebe.log"
          exit 1

      - name: Test
        run: cargo test --workspace --locked -- --include-ignored
        working-directory: wasm

      - name: reebe log
        if: failure()
        run: cat "$RUNNER_TEMP/reebe.log"

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file wasm/Cargo.lock --deny warnings
