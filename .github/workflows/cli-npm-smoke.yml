name: CLI npm smoke

# Split out of ci.yml: the macOS and Windows runners bill 10x and 2x, so this only runs on
# PRs that touch what it exercises (the launcher, the legacy CLI, the platform packages and
# the Rust binary) and on pushes to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/cli/**"
      - "packages/**"
      - "crates/**"
      - "scripts/smoke-cli-npm.mjs"
      - "scripts/lib/cli-npm.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cli-npm-smoke.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # `npx @bpmnkit/cli@next --version` without a registry: pack the launcher, the legacy CLI and
  # this runner's platform package from the tree (with the binary just built), install the
  # tarballs and run `bpmnkit` and its alias from node_modules/.bin. The legacy tarball is packed
  # without a build (it needs the wasm toolchain); `--version` never reaches it.
  cli-npm-smoke:
    name: cli npm smoke (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Allow long paths (Windows)
        # Camunda docspack chunk names exceed MAX_PATH; git on Windows refuses them otherwise.
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Launcher tests
        run: pnpm --filter @bpmnkit/cli test

      - name: Build the binary
        run: cargo build --release --locked -p bpmnkit-cli

      - name: Install the packed tarballs and run them
        shell: bash
        run: |
          BIN=target/release/bpmnkit
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/release/bpmnkit.exe; fi
          node scripts/smoke-cli-npm.mjs --bin "$BIN"
