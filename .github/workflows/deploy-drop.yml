name: Deploy Drop

on:
  push:
    branches: [main]
    paths:
      - "apps/drop/**"
      - "packages/core/**"
      - "packages/canvas/**"
      # Drop depends on both since #218.
      - "packages/connector-gen/**"
      - "packages/engine/**"
      # The room replays the writer's ops through @bpmnkit/editor/headless, and
      # the browser loads the editor itself on claim — a change to either is a
      # change to what Drop serves.
      - "packages/editor/**"
      - "packages/plugins/**"
      - "packages/ui/**"
  workflow_dispatch:

concurrency:
  group: deploy-drop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drop depends on @bpmnkit/engine, which builds against @bpmnkit/reebe-wasm.
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/reebe -> target

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: "latest" needs a GitHub API lookup and silently falls back to
          # v0.9.1 when it is rate-limited, whose wasm-opt rejects current rustc output.
          version: v0.15.0

      - name: Build reebe-wasm
        env:
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          WASM_VERSION=$(node -p "require('./apps/reebe-wasm/package.json').version")
          wasm-pack build apps/reebe/crates/reebe-wasm --target web --scope bpmnkit --out-dir "$GITHUB_WORKSPACE/apps/reebe-wasm"
          node scripts/patch-wasm-pkg.mjs "$WASM_VERSION"

      - name: Build drop (client bundles + workspace deps)
        run: pnpm turbo build --filter @bpmnkit/drop

      # CLOUDFLARE_DROP_API_TOKEN is a dedicated token scoped to this workflow:
      # Account → D1 → Edit, Account → Workers Scripts → Edit,
      # Zone (bpmnkit.com) → Workers Routes → Edit.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DROP_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/drop
          command: d1 migrations apply bpmnkit-drop --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DROP_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/drop
          command: deploy
