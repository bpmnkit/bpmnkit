[package]
name = "bpmnkit-wasm-host"
description = "Runs BPMN Kit Wasm job workers: loads components, enforces their manifest, and serves their job types through bpmnkit-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bpmnkit-wasm-contract = { path = "../contract", features = ["inspect"] }
bpmnkit-worker = { path = "../../../crates/bpmnkit-worker", version = "0.7.1" }
serde_json = { workspace = true }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
tracing = "0.1"
wasmtime = { version = "51", default-features = false, features = ["cranelift", "component-model", "async", "pooling-allocator", "runtime", "std", "addr2line"] }
wasmtime-wasi = "51"
wasmtime-wasi-http = "51"
# Own send path (allow-list, host-side DNS, address filter); versions match wasmtime-wasi-http's.
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
bpmnkit-worker = { path = "../../../crates/bpmnkit-worker", features = ["testing"] }
wat = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bpmnkit-wasm-test-support = { path = "../test-support" }
wit-component = "0.263"
wit-parser = "0.263"
