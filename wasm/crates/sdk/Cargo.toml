[package]
name = "bpmnkit-wasm-sdk"
description = "Guest SDK for BPMN Kit Wasm job workers: typed jobs, outcomes, secrets, log and a blocking HTTP client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependency on bpmnkit-wasm-contract: only its WIT is read (at compile time), so the guest
# does not pull in toml, sha2 or the BPMN parser.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = "0.63"
