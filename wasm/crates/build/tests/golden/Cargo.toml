[package]
name = "worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bpmnkit-wasm-sdk = { path = "/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
incremental = false
debug = false
strip = true

# Stops cargo from adopting an enclosing workspace.
[workspace]
